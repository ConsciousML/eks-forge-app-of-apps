apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-admission-webhooks
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: keda-admission-webhooks
  ingress:
    # Kubelet liveness and readiness probes.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # kube-apiserver calling the ValidatingWebhookConfiguration (ScaledObject and
    # TriggerAuthentication admission review).
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
