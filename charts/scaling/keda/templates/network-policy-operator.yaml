apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-operator
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: keda-operator
  ingress:
    # Kubelet liveness and readiness probes.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Metrics API server reading scaler metrics over gRPC.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: keda-operator-metrics-apiserver
      toPorts:
        - ports:
            - port: "9666"
              protocol: TCP
    # kube-prometheus-stack scraping /metrics (ServiceMonitor).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Prometheus scaler queries.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
