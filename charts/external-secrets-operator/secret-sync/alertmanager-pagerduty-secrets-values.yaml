name: alertmanager-pagerduty
targetSecretName: alertmanager-pagerduty
# ESO is the sole owner of this secret, and the source integration key can be rotated, so create
# it and keep polling.
targetCreationPolicy: Owner
refreshPolicy: Periodic
# remoteProperty value here must match the secret_data key in
# units/pagerduty/aws_secret/terragrunt.hcl (eks-forge-catalog repo).
data:
  - secretKey: routing_key
    remoteProperty: routing_key
