# Loaded by Grafana's dashboard sidecar, which watches every namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dcgm-exporter-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: GPU
data:
  dcgm-exporter.json: |-
{{ .Files.Get "dashboards/dcgm-exporter.json" | indent 4 }}
