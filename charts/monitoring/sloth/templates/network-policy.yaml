apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sloth
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sloth
  ingress:
    # kube-prometheus-stack scraping the upstream chart's PodMonitor.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
