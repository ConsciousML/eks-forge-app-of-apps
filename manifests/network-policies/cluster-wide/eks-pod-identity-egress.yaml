apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: eks-pod-identity-egress
spec:
  # Opt-in label set in manifests/namespaces/. Never on argocd and kube-system, which keep their
  # own copies to avoid a lockout if this Application fails to sync.
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.network-policy.eks-forge.io/eks-pod-identity-egress: "true"
  egress:
    # EKS Pod Identity credential endpoint, documented at
    # https://docs.aws.amazon.com/eks/latest/userguide/pod-id-how-it-works.html
    # 169.254.170.23 is a host-owned address, so Cilium resolves it to the
    # reserved "host" identity rather than a CIDR-matched destination.
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
