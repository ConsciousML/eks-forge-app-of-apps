apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: kube-dns-egress
spec:
  # Opt-in label set in manifests/namespaces/ and manifests/features/<feature>/namespaces/.
  # Never on argocd and kube-system, which keep their own copies to avoid a lockout if this
  # Application fails to sync.
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.network-policy.eks-forge.io/kube-dns-egress: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
