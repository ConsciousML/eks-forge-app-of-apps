apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: kube-apiserver-egress
spec:
  # Opt-in label set in manifests/namespaces/ and manifests/features/<feature>/namespaces/.
  # Never on argocd and kube-system, which keep their own copies to avoid a lockout if this
  # Application fails to sync.
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.network-policy.eks-forge.io/kube-apiserver-egress: "true"
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
