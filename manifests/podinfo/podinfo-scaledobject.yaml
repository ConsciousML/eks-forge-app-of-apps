apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: podinfo
spec:
  scaleTargetRef:
    name: podinfo
  minReplicaCount: 1
  maxReplicaCount: 10
  # Holds the current replicas while Prometheus is unreachable, never scales down blind.
  # An empty result (no traffic yet) reads as 0, not as an error.
  fallback:
    failureThreshold: 3
    replicas: 1
    behavior: currentReplicasIfHigher
  advanced:
    horizontalPodAutoscalerConfig:
      # Default scale-down stabilization is 5m, too slow to watch the demo unfold.
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 30
  triggers:
    # AverageValue divides the total RPS by the replicas, so threshold is per pod.
    # Probes and scrapes excluded, same filter as podinfo-slo.yaml.
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        query: sum(rate(http_request_duration_seconds_count{namespace="podinfo", path!~"healthz|readyz|metrics"}[1m]))
        # ~70% of one pod's measured plateau (~430 RPS at the 50m CPU limit).
        threshold: "300"
