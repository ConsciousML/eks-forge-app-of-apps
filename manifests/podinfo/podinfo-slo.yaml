apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: podinfo
spec:
  service: podinfo
  # Measured at podinfo's ALB, from the per-minute CloudWatch counts yace exports (sum_over_time, never rate).
  # CloudWatch lags 3 to 5m, so alerts fire and resolve a few minutes late.
  slos:
    # The ALB 5XX has no TargetGroup dimension, so podinfo must stay the only app on its Gateway.
    # A 503 (no healthy target) is missing from RequestCount, so the total adds it back.
    # With no pod, RequestCount stops too, so an outage reads as 100% errors.
    # A zero total is dropped (> 0), never 0/0: one NaN sample breaks the 30d budget for 30 days.
    # A missing 5XX series reads as 0.
    - name: requests-availability
      objective: 99
      description: "99% of podinfo HTTP requests through its ALB return a non-5xx status."
      sli:
        events:
          errorQuery: |
            (sum(sum_over_time(aws_applicationelb_httpcode_target_5_xx_count_sum{tag_eks_forge_io_slo_service="podinfo"}[{{.window}}])) or vector(0))
            +
            (sum(sum_over_time(aws_applicationelb_httpcode_elb_5_xx_count_sum{tag_eks_forge_io_slo_service="podinfo"}[{{.window}}])) or vector(0))
          totalQuery: |
            (
              (sum(sum_over_time(aws_applicationelb_request_count_sum{tag_eks_forge_io_slo_service="podinfo"}[{{.window}}])) or vector(0))
              +
              (sum(sum_over_time(aws_applicationelb_httpcode_elb_503_count_sum{tag_eks_forge_io_slo_service="podinfo"}[{{.window}}])) or vector(0))
            ) > 0
      alerting:
        name: PodinfoAvailabilityBudgetBurn
        labels:
          component: slo
        annotations:
          summary: "podinfo is burning its availability error budget"
          description: "podinfo 5xx ratio burns the 30d error budget of its 99% availability SLO too fast."
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
    # TargetResponseTime runs from the ALB forwarding a request to podinfo's response headers, queueing in the pod included.
    # TC(:0.1) counts its samples of 100ms or less per minute, so slow is SampleCount minus TC. 502 and 504 have no sample.
    - name: requests-latency
      objective: 99
      description: "99% of podinfo HTTP requests through its ALB get response headers in 100ms or less."
      sli:
        events:
          errorQuery: |
            sum(sum_over_time(aws_applicationelb_target_response_time_sample_count{tag_eks_forge_io_slo_service="podinfo"}[{{.window}}]))
            -
            sum(sum_over_time(aws_applicationelb_target_response_time_tc__0_1_{tag_eks_forge_io_slo_service="podinfo"}[{{.window}}]))
          totalQuery: sum(sum_over_time(aws_applicationelb_target_response_time_sample_count{tag_eks_forge_io_slo_service="podinfo"}[{{.window}}]))
      alerting:
        name: PodinfoLatencyBudgetBurn
        labels:
          component: slo
        annotations:
          summary: "podinfo is burning its latency error budget"
          description: "podinfo requests over 100ms burn the 30d error budget of its 99% latency SLO too fast."
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
